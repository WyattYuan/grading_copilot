# pytest 配置文件

[tool:pytest]
# 测试发现规则
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出格式
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# 标记定义
markers =
    unit: 单元测试 - 测试单个组件
    integration: 集成测试 - 测试多个组件协作，可能需要启动服务
    slow: 慢速测试 - 执行时间较长的测试
    deprecated: 已废弃的测试 - 保留用于参考

# 覆盖率配置
[coverage:run]
source = src
omit = 
    */tests/*
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# 排除特定行
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
