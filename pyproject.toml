[project]
name = "grading_copilot"
version = "0.1.0"
description = "AI-powered grading system with human-in-the-loop supervision"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "streamlit>=1.39.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "python-docx>=1.1.0",
    "pandas>=2.2.0",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.0",
    "langchain-community>=0.4.1",
    "dashscope>=1.24.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
